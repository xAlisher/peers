# Dependency updates. Grouped and rate-limited deliberately: this is a solo-maintained repo and
# an unbounded PR firehose is worse than no automation at all.
#
# Every ecosystem sets a `cooldown`. A newly published version is the highest-risk version there
# is — compromised-maintainer and typosquat attacks are usually caught within days of publish, so
# waiting before auto-proposing an upgrade turns "we adopted it in an hour" into "we adopted it
# after the ecosystem had a week to notice." For a messenger whose users assume their traffic is
# private, that trade is clearly worth one week of latency on non-security bumps.
#
# Note: cooldown delays *version* updates. Dependabot **security** alerts and security PRs are not
# subject to it, so a known-CVE fix still arrives immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # One PR for routine patch/minor bumps; majors still come through individually so they
      # get read properly.
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # #470: the Babel major line is not ours to pick. Every transform this repo actually runs
      # comes from `module:@react-native/babel-preset` (babel.config.js and jest.logic.config.js),
      # and React Native 0.86 ships that preset with `@babel/core@^7.25.2` as a hard dependency
      # and a Babel-7 plugin tree underneath it. The root `@babel/core` devDep exists only to
      # satisfy that preset's `peer @babel/core: *` — nothing in this repo loads it directly.
      #
      # So bumping it to 8 buys nothing and costs a lot: #470 made `npm ci` fail outright
      # (ERESOLVE, `@babel/preset-env@7` peers on `@babel/core@^7.0.0-0`), and bumping
      # preset-env to 8 alongside it only downgrades that to 15 silently-overridden peers —
      # jest's Babel-7 syntax plugins handed a Babel-8 core — while inflating the install from
      # 911 to 1274 packages and from 1 to 16 copies of `@babel/core`. Tripling the build-time
      # supply-chain surface of a messenger for an unused devDep is the wrong trade.
      #
      # Lift this when React Native itself moves to Babel 8; `__tests__/babelToolchain.test.ts`
      # holds the same line from inside the repo.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]

      # #505: same story, different toolchain. The ESLint major is set by
      # `@react-native/eslint-config`, which is the entire content of this repo's lint config
      # (.eslintrc.js is `extends: '@react-native'` and nothing else).
      #
      # #505 bumped eslint to 10.8.0 and both required jobs died at `npm ci` with ERESOLVE:
      # `@react-native/eslint-config@0.86.2` peers on `eslint@^8.0.0 || ^9.0.0`. No published
      # release fixes that — 0.86.2 is `latest`, and even the 0.88.0 nightlies still declare the
      # same `^8 || ^9`. ESLint 10 also removed eslintrc outright, so adopting it means rewriting
      # the config for a shared config that cannot run under it.
      #
      # ESLint 9 is not the escape hatch either, despite being inside that peer range. The config
      # subtree carries `eslint-plugin-ft-flow@^8.1.0`, and under ESLint 9 loading it throws
      # `TypeError: context.getAllComments is not a function` before a single file is linted —
      # verified locally on this branch. The peer range is optimistic; 8 is the only major the
      # shared config's own dependencies actually run on.
      #
      # Lift this when React Native ships an eslint-config whose whole subtree accepts 9+;
      # `__tests__/lintToolchain.test.ts` holds the same line from inside the repo and will fail
      # loudly at that point.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # #507: VisionCamera 5 has no code scanning on Android, and Android is all we ship.
      #
      # v5 is a Nitro rewrite. It deletes `useCodeScanner` and the `<Camera codeScanner={...}>`
      # prop; the replacement is `useObjectOutput` / `CameraObjectOutput`, annotated `@platform iOS`
      # throughout the v5 sources — and on Android its factory is a stub that throws:
      #
      #     HybridCameraFactory.kt:113
      #       override fun createObjectOutput(...): HybridCameraObjectOutputSpec {
      #         throw Error("CameraObjectOutput is not available on Android!")
      #       }
      #
      # src/screens/ScanScreen.tsx is *entirely* a QR scanner — it is how a peer's 64-hex address
      # gets into the app without retyping it. Under v5 it would throw on mount, and there is no
      # migration to write until upstream implements the Android side.
      #
      # #507 also failed the kotlin-unit job outright (VisionCamera 5's build.gradle needs
      # `project(":react-native-nitro-modules")` and `project(":react-native-nitro-image")`, which
      # autolinking never includes because npm installs those peers without declaring them). That
      # part IS fixable by declaring both packages — which is exactly the trap: the fix turns CI
      # green over a scan screen that no longer works.
      #
      # Lift this when VisionCamera ships an Android CameraObjectOutput.
      # `__tests__/visionCameraContract.test.ts` holds the same line from inside the repo.
      - dependency-name: "react-native-vision-camera"
        update-types: ["version-update:semver-major"]

      # #530: React Native 0.87 has no stable animation stack to stand on yet. The ceiling is a
      # chain, and `react-native-reanimated` is the single link holding it down:
      #
      #     react-native-reanimated@4.5.3  peer react-native-worklets: "0.10.x - 0.11.x"
      #     react-native-worklets@0.11.4   peer react-native:          "0.83 - 0.86"
      #
      # Worklets has ALREADY moved — 0.12.x peers `react-native: "0.83 - 0.87"`. It just cannot be
      # adopted, because reanimated 4.5.3 refuses anything above 0.11.x. So bumping worklets alone
      # does not unblock 0.87; reanimated is the thing to wait for.
      #
      # The 0.87 bump reproduced #470's exact failure shape — `npm ci` died with ERESOLVE and BOTH
      # required jobs failed at install, before either suite could say anything about the code.
      # Neither package is droppable: `src/components/MediaViewer.tsx` imports reanimated directly,
      # and `babel.config.js` loads `react-native-worklets/plugin` as its last plugin.
      #
      # The other direction — "just upgrade reanimated" — is not available. As of 2026-08-21 the
      # newest STABLE reanimated is 4.5.3; the only published builds that accept 0.87 are the
      # `4.6.0-nightly-*` line. Shipping a nightly animation engine in a messenger release to
      # unblock a routine dependency bump is a worse trade than staying one minor back.
      #
      # `react-native` and `@react-native/*` are ignored together because they version in
      # lockstep: `@react-native/new-app-screen` peers on an EXACT `react-native@0.86.2`, so
      # letting the siblings drift alone just re-breaks the install a different way.
      #
      # This is semver-MINOR rather than major because React Native is pre-1.0 — 0.87 *is* its
      # major line. Patch bumps (0.86.x) still come through.
      #
      # Lift this when reanimated ships a STABLE release whose peer range reaches the React Native
      # minor being proposed (and, transitively, a worklets line that does too).
      # `__tests__/reanimatedToolchain.test.ts` holds the same line from inside the repo.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-minor"]
    labels: [dependencies]

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # #464, then #513 again: the wrapper bump 9.3.1 -> 9.6.1 kills the build before a single
      # test runs. React Native ships its Gradle plugin as an *included build*, so `./gradlew`
      # compiles RN's own Kotlin sources with the Kotlin RN pins (2.1.20 for RN 0.86) against the
      # kotlin-stdlib the Gradle distribution embeds. A wrapper bump moves only the second one:
      #
      #     Gradle 9.3.1 -> kotlin-stdlib 2.2.21 (metadata 2.2.0)  OK
      #     Gradle 9.6.1 -> kotlin-stdlib 2.3.21 (metadata 2.3.0)  breaks
      #
      # A Kotlin compiler reads metadata one minor past its own and no further, so 2.1.20 tops out
      # at 2.2.0. `:gradle-plugin:settings-plugin:compileKotlin` then dies with "Internal compiler
      # error" and a wall of "compiled with an incompatible version of Kotlin" that names neither
      # the wrapper nor Dependabot.
      #
      # Scoped to >= 9.4 rather than the whole dependency so a 9.3.x patch is not blocked outright;
      # the in-repo guard still refuses to adopt any wrapper whose embedded Kotlin nobody measured.
      # Lift this when React Native raises its pinned Kotlin past the embedded stdlib's minor.
      # `__tests__/gradleToolchain.test.ts` holds the same line from inside the repo.
      # Maven/Gradle `ignore.versions` uses Maven RANGE syntax ([1.4,)), not npm comparators —
      # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
      # `[9.4,)` = 9.4 inclusive and up. (`>= 9.4` is npm-semver and Dependabot's Maven parser
      # would not honour it — Senti P1 on #513.)
      - dependency-name: "gradle-wrapper"
        versions: ["[9.4,)"]

      # #464, then #513 again: `animated-gif` is not a standalone library. It is one artifact of
      # the Fresco set, and React Native ships the rest (fresco, imagepipeline, imagepipeline-
      # native, fbcore, ...) transitively at the version RN builds against — 3.6.0 for RN 0.86.
      # Gradle resolves a conflicting graph to the HIGHEST version, so bumping this one artifact
      # silently drags every Fresco module past what react-android was compiled against:
      #
      #     com.facebook.fresco:fresco:3.6.0 -> 3.7.0
      #     com.facebook.fresco:imagepipeline:3.6.0 -> 3.7.0
      #     com.facebook.fresco:imagepipeline-native:3.6.0 -> 3.7.0   (:app:dependencies, #513)
      #
      # Nothing errors. It compiles, links, installs and renders the GIF's first frame — it just
      # never animates again, gutting #300, the entire reason the artifact is declared.
      #
      # Lift this when RN itself bumps Fresco; the pin must then move to RN's new version, not
      # ahead of it. `__tests__/gradleToolchain.test.ts` holds the same line from inside the repo.
      # Maven range: `(3.6.0,)` = strictly above 3.6.0, unbounded (Senti P1 on #513 — not `> 3.6.0`).
      - dependency-name: "com.facebook.fresco:animated-gif"
        versions: ["(3.6.0,)"]

      # #549: SQLCipher 4.18.0 and 4.19.0 both declare `minCompileSdk=37` in their AAR metadata,
      # and the app compiles against 36 — AGP 8.12 caps compileSdk at 36, so raising it is a
      # toolchain upgrade, not a dependency bump. The grouped #549 bump (4.17.0 -> 4.19.0) killed
      # `kotlin-unit` in `:app:checkDebugAarMetadata` before a single test ran.
      #
      # Lift this together with the compileSdk/AGP upgrade to 37+.
      # `__tests__/gradleToolchain.test.ts` holds the same line from inside the repo.
      - dependency-name: "net.zetetic:sqlcipher-android"
        versions: ["[4.18,)"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies]

# NOTE: this does NOT cover the native messaging cores. liblogoschat.so is built from a patched
# fork of logos-messaging/libchat and its Rust dependency tree has no advisory feed reaching this
# repo — so a clean Dependabot/npm-audit run says nothing about it. That gap is real and is not
# closed by this file.
