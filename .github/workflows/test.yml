name: test

on:
  push:
    branches: [main]
  pull_request:
  # #449: a PR opened/pushed during a GitHub Actions webhook throttle (e.g. the
  # 2026-08-06 incident) can have its pull_request event DROPPED, so no run ever
  # queues and required checks never report — the PR stays blocked with no config
  # fault. This lets a maintainer re-run the checks for a branch by hand
  # (Actions tab -> test -> Run workflow) without pushing an empty commit.
  workflow_dispatch:

jobs:
  js-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: JS logic tests (wire codec + store view helpers)
        run: npm run test:logic
      - name: Dependency audit (#366) — block on critical, report the rest
        run: |
          npm audit --audit-level=critical
          npm audit || true   # full high/moderate report for visibility (non-blocking)

  kotlin-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Kotlin unit tests (Robolectric — schema, epochs, merge, ns-timestamp)
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Assert release build disables cleartext traffic (#363)
        working-directory: android
        run: |
          ./gradlew :app:processReleaseManifest
          MANIFEST=$(find app/build/intermediates -path '*merged_manifest*release*' -name AndroidManifest.xml | head -1)
          echo "release manifest: $MANIFEST"
          grep -q 'usesCleartextTraffic="false"' "$MANIFEST" \
            || { echo "::error::release manifest permits cleartext traffic (#363)"; exit 1; }
          echo "OK: release disables cleartext traffic"
          grep -q 'android:allowBackup="false"' "$MANIFEST" \
            || { echo "::error::release manifest allows backup (#366)"; exit 1; }
          echo "OK: release disables backup"
